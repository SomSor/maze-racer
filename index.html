<!doctype html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>เกมสนุก</title>
    <style>
        :root {
            --ink: #172033;
            --paper: #fffdf6;
            --sun: #ffd447;
            --coral: #f06b4f;
            --sky: #9ee6e8;
            --line: #172033;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            color: var(--ink);
            font-family: Tahoma, "Noto Sans Thai", sans-serif;
            background-color: #dff5ee;
            background-image: linear-gradient(rgba(23, 32, 51, .1) 1px, transparent 1px), linear-gradient(90deg, rgba(23, 32, 51, .1) 1px, transparent 1px);
            background-size: 28px 28px;
        }

        main {
            width: min(880px, calc(100% - 32px));
            padding: 42px 0;
        }

        header { margin-bottom: 28px; }

        .eyebrow {
            margin: 0 0 8px;
            color: var(--coral);
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-family: Georgia, "Times New Roman", serif;
            font-size: clamp(38px, 7vw, 68px);
            font-weight: 800;
            letter-spacing: 0;
            line-height: 1;
        }

        .subtitle { margin: 13px 0 0; font-size: 17px; line-height: 1.6; }

        .games {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 22px;
        }

        .game-link {
            min-height: 280px;
            padding: 26px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            border: 3px solid var(--line);
            border-radius: 8px;
            color: inherit;
            text-decoration: none;
            box-shadow: 8px 8px 0 var(--line);
            transition: transform .15s ease, box-shadow .15s ease;
        }

        .game-link:hover, .game-link:focus-visible {
            transform: translate(-4px, -4px);
            box-shadow: 12px 12px 0 var(--line);
        }

        .game-link:focus-visible { outline: 3px solid var(--coral); outline-offset: 4px; }
        .maze { background: var(--sun); }
        .wheel { background: var(--sky); }
        .orbit { background: #f5d5ff; }

        .game-icon { font-size: 58px; line-height: 1; }
        h2 { margin: 24px 0 8px; font-size: 27px; line-height: 1.2; }
        .game-link p { margin: 0; font-size: 16px; line-height: 1.55; }
        .open { margin-top: auto; padding-top: 26px; font-size: 14px; font-weight: 800; }

        @media (max-width: 620px) {
            main { padding: 28px 0; }
            .games { grid-template-columns: 1fr; }
            .game-link { min-height: 230px; }
        }
    </style>
</head>
<body>
    <main>
        <header>
            <p class="eyebrow">เลือกเกม</p>
            <h1>เกมสนุก</h1>
            <p class="subtitle">เลือกเกมที่ต้องการเล่นได้เลย</p>
        </header>

        <section class="games" aria-label="รายการเกม">
            <a class="game-link maze" href="maze-racer/index.html" target="_blank" rel="noopener">
                <span class="game-icon" aria-hidden="true">🏁</span>
                <h2>Maze Race</h2>
                <p>แข่งกันหาทางออกจากเขาวงกต</p>
                <span class="open">เปิดเกมในแท็บใหม่ ↗</span>
            </a>

            <a class="game-link wheel" href="wheel-plate/index.html" target="_blank" rel="noopener">
                <span class="game-icon" aria-hidden="true">🎡</span>
                <h2>วงล้อสุ่มชื่อ</h2>
                <p>สุ่มเลือกชื่อจากรายชื่อผู้เล่น</p>
                <span class="open">เปิดเกมในแท็บใหม่ ↗</span>
            </a>

            <a class="game-link orbit" href="finger-orbit/index.html" target="_blank" rel="noopener">
                <span class="game-icon" aria-hidden="true">🪐</span>
                <h2>Finger Orbit</h2>
                <p>เล็งปลายนิ้วชี้เพื่อทำให้ดาวโคจรไปรอบตัว</p>
                <span class="open">เปิดเกมในแท็บใหม่ ↗</span>
            </a>
        </section>
    </main>
</body>
</html>
